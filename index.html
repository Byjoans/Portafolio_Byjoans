<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Prevent scripts from trying to redefine fetch if it's a read-only getter
      if (typeof window !== 'undefined' && window.fetch) {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set) {
            console.warn('window.fetch is a read-only getter in this environment.');
            // Some scripts might try to do: window.fetch = ...
            // We can't fix that directly if it's not configurable, but we've warned.
          }
        } catch (e) {}
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
